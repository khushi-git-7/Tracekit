name: verify-722
on:
  push:
    branches: [verify/722-durations]
permissions:
  contents: read
jobs:
  probe:
    name: bounded probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --no-tags --depth=1 https://github.com/Cygnux-Labs/Tracekit "+refs/tags/v*:refs/tags/v*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: ApprovalStateSpace as on main
        run: python -m pytest -q --durations=0 -p no:cacheprovider tests/test_bounded.py::ApprovalStateSpace
      - name: ApprovalStateSpace with fsync stubbed in the workers (experiment)
        env:
          TK_EXPERIMENT_NO_FSYNC: "1"
        run: python -m pytest -q --durations=0 -p no:cacheprovider tests/test_bounded.py::ApprovalStateSpace
      - name: Pool start-up alone (spawn 4 workers, import test_bounded, no work)
        run: python -c "import sys,time;sys.path.insert(0,'tests');from factories import process_pool;t=time.perf_counter();p=process_pool();list(p.map(__import__,['test_bounded']*8));print('pool start + import', round(time.perf_counter()-t,2),'s');p.shutdown()"
