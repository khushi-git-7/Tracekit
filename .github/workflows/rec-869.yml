name: rec-869
on:
  push:
    branches: [verify/869-record]
permissions:
  contents: read
jobs:
  record:
    name: record a Qwen Code session for tracekit audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: folders
        run: |
          echo "OUT=$RUNNER_TEMP/rec869" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/work869" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: install Qwen Code
        run: |
          npm install -g @qwen-code/qwen-code@latest
          npm ls -g @qwen-code/qwen-code
          qwen --version
          qwen --help
      - name: where Qwen Code keeps its files (from its own source)
        run: |
          D=$(npm root -g)/@qwen-code/qwen-code
          grep -rhoE ".{0,40}static getGlobalQwenDir.{0,500}" "$D" --include=*.js | head -3
          grep -rhoE ".{0,40}static getRuntimeBaseDir.{0,700}" "$D" --include=*.js | head -3
          grep -rhoE ".{0,200}(QWEN_HOME|QWEN_DIR|QWEN_CONFIG_DIR|QWEN_RUNTIME_DIR|QWEN_CODE_HOME|QWEN_DATA_DIR)[A-Z_]*.{0,200}" "$D" --include=*.js | head -12
          grep -rhoE "\"QWEN_[A-Z_]*\"|process\.env\.QWEN_[A-Z_]*|env\[\"QWEN_[A-Z_]*\"\]" "$D" --include=*.js | sort | uniq -c | sort -rn | head -40
          grep -rhoE ".{0,200}(PROJECT_DIR_NAME|getProjectId|sanitizeCwd|projectId *=).{0,200}" "$D" --include=*.js | head -6
      - name: record
        run: |
          mkdir -p "$OUT" "$WORK" ~/.qwen
          export HOOK_LOG="$OUT/hooks.jsonl"; echo "HOOK_LOG=$HOOK_LOG" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          hook = lambda ev: {"type": "command", "name": "rec869", "timeout": 30000,
                             "command": f"python3 {os.getcwd()}/.github/rec869/hook.py {ev}"}
          s = {"selectedAuthType": "openai", "security": {"auth": {"selectedType": "openai"}}, "model": {"name": "rec-model"},
               "hooks": {ev: [{"matcher": "*", "hooks": [hook(ev)]}] for ev in ("PreToolUse", "PostToolUse", "PostToolUseFailure")}}
          json.dump(s, open(os.path.expanduser("~/.qwen/settings.json"), "w"), indent=1)
          PY
          cat ~/.qwen/settings.json
          touch "$RUNNER_TEMP/marker"; sleep 1
          chmod +x .github/rec869/run.sh
          # round 1: a new session, write, read, edit and a shell command
          .github/rec869/run.sh first 8791 write,read,edit,shell -p "Make notes.txt, read it, change one to uno, then run echo." --yolo
          # round 2: the same session resumed, one more shell command
          .github/rec869/run.sh resumed 8792 shell2 --continue -p "Run one more echo." --yolo || true
          # round 2b: if --continue isn't an option, --resume
          grep -q "Unknown argument" "$OUT/resumed/stderr.txt" && .github/rec869/run.sh resumed2 8793 shell2 --resume -p "Run one more echo." --yolo || true
          # round 3: a second, new session in the same project: a second file?
          .github/rec869/run.sh second 8794 shell2 -p "Run one echo." --yolo || true
          # round 4: QWEN_HOME and QWEN_RUNTIME_DIR (the two its source reads): where do the session files go?
          for v in QWEN_HOME QWEN_RUNTIME_DIR; do
            H="$RUNNER_TEMP/var-$v"; mkdir -p "$H/.qwen"; cp ~/.qwen/settings.json "$H/settings.json"; cp ~/.qwen/settings.json "$H/.qwen/settings.json"
            env "$v=$H" .github/rec869/run.sh "env-$v" 8795 shell2 -p "Run one echo." --yolo >/dev/null 2>&1 || true
            echo "--- $v=$H: session files:"; find "$H" -name '*.jsonl' -path '*chats*' | head
          done
          echo "--- session files under ~/.qwen now:"; find ~/.qwen -name '*.jsonl' -path '*chats*'
      - name: which calls reached PreToolUse (hook log) against the session files
        run: |
          python3 - <<'PY'
          import glob, json, os
          hooks = [json.loads(l) for l in open(os.environ["HOOK_LOG"])] if os.path.exists(os.environ["HOOK_LOG"]) else []
          print(len(hooks), "hook payloads; keys of the first:", sorted(hooks[0]["payload"]) if hooks else None)
          for h in hooks:
              p = h["payload"]
              print(h["argv"], p.get("hook_event_name"), p.get("tool_use_id"), p.get("tool_name"),
                    json.dumps(p.get("tool_input"))[:100], "| session", p.get("session_id"),
                    "| other keys:", sorted(set(p) - {"hook_event_name", "tool_use_id", "tool_name", "tool_input",
                                                      "session_id", "tool_response", "transcript_path", "cwd"}))
          pre = {h["payload"].get("tool_use_id") for h in hooks if h["payload"].get("hook_event_name") == "PreToolUse"}
          for f in glob.glob(os.path.expanduser("~/.qwen/projects/*/chats/*.jsonl")):
              for e in map(json.loads, open(f)):
                  u = (e.get("systemPayload") or {}).get("uiEvent") or {}
                  if u.get("event.name") == "qwen-code.tool_call":
                      print(os.path.basename(f), u["call_id"], u["function_name"], u.get("status"), "prompt", u.get("prompt_id"),
                            "-> PreToolUse saw it" if u["call_id"] in pre else "-> NO PreToolUse")
          PY
          echo "--- the first PreToolUse payload in full"; head -1 "$HOOK_LOG" | head -c 3000
      - name: the files the sessions wrote
        run: |
          echo "--- every file under ~ written by the runs (not node_modules, npm or caches)"
          find ~ -newer "$RUNNER_TEMP/marker" -type f -not -path '*/node_modules/*' -not -path '*/.npm/*' -not -path '*/.cache/*' 2>/dev/null | head -100
          mkdir -p "$OUT/home-qwen"; cp -r ~/.qwen "$OUT/home-qwen/" 2>/dev/null
          for f in $(find ~/.qwen -newer "$RUNNER_TEMP/marker" -type f \( -name '*.json' -o -name '*.jsonl' \) | head -20); do
            echo "=================== $f ($(wc -c < "$f") bytes, $(wc -l < "$f") lines)"; head -c 6000 "$f"; echo
          done
      - name: each recorded call as Qwen's hook maps it
        run: |
          python - <<'PY'
          import json, os
          from tracekit import agent_hooks
          def walk(o):
              if isinstance(o, dict):
                  if isinstance(o.get("name"), str) and isinstance(o.get("args"), dict):
                      yield o
                  for v in o.values():
                      yield from walk(v)
              elif isinstance(o, list):
                  for v in o:
                      yield from walk(v)
          for dp, _, fs in os.walk(os.path.expanduser("~/.qwen")):
              for f in fs:
                  if not f.endswith((".json", ".jsonl")):
                      continue
                  path = os.path.join(dp, f)
                  try:
                      text = open(path, encoding="utf-8").read()
                  except OSError:
                      continue
                  docs = []
                  for line in (text.splitlines() if f.endswith(".jsonl") else [text]):
                      try:
                          docs.append(json.loads(line))
                      except ValueError:
                          pass
                  seen = set()
                  for d in docs:
                      for c in walk(d):
                          k = (c.get("id"), c["name"], json.dumps(c["args"], sort_keys=True))
                          if k in seen:
                              continue
                          seen.add(k)
                          print(path, "|", c.get("id"), c["name"], "->", agent_hooks.tool("qwen", c["name"], c["args"]))
          PY
      - name: tracekit audit on what was written
        run: |
          for root in ~/.qwen/tmp ~/.qwen ~/.qwen/projects; do
            [ -d "$root" ] || continue
            echo "=== tracekit audit $root --agent gemini"; tracekit audit "$root" --agent gemini --json 2>&1 | head -80
          done
          echo "=== tracekit audit --agent qwen"; tracekit audit --agent qwen 2>&1 | head -20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rec869
          path: ${{ runner.temp }}/rec869
          include-hidden-files: true
