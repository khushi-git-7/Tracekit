name: verify-771
on:
  push:
    branches: [verify/771-tests]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyflakes tracekit tracekit_sdk.py tests eval examples
      - run: python -m pytest -q -o faulthandler_timeout=240 -p no:cacheprovider tests/test_audit.py tests/test_agent_hooks.py tests/test_harness_hooks_v2.py tests/test_docs.py tests/test_readme.py
        env:
          PYTHONUTF8: "1"
      - name: As a user, the issue's reproduction
        shell: bash
        run: |
          echo '{"tool":"read_image","args":{"source":"http://[::1/cat.png"}}' > calls.jsonl
          echo '{"tool":"shell","args":{"command":"ls"}}' >> calls.jsonl
          tracekit audit --calls calls.jsonl --agent goose; echo "exit=$?"
