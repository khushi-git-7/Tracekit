name: verify-722-py
on:
  push:
    branches: [verify/722-py]
  workflow_dispatch:
jobs:
  same-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.12
            3.13
      - name: runner
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo; head -2 /etc/os-release
          which python3.12 python3.13; python3.12 -VV; python3.13 -VV
      - name: two venvs, same tree
        run: |
          for v in 3.12 3.13; do python$v -m venv /tmp/v$v; /tmp/v$v/bin/python -m pip install -q -e ".[dev]"; done
          for v in 3.12 3.13; do /tmp/v$v/bin/python -m pip freeze > /tmp/freeze-$v.txt; done
          diff /tmp/freeze-3.12.txt /tmp/freeze-3.13.txt || true
      - name: interleaved rounds
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          FILES="tests/test_canon.py tests/test_constraints.py tests/test_audit.py tests/test_findings_box.py"
          run() {   # $1 python, $2 label, $3 GC_THRESHOLD or empty
            echo "=== round $r $2"
            s=$(date +%s.%N)
            GC_THRESHOLD="$3" /tmp/v$1/bin/python -m pytest -q -p no:cacheprovider -p verify722.gcstat -o faulthandler_timeout=240 $FILES | grep -E "gcstat|passed|failed" || true
            e=$(date +%s.%N)
            echo "=== round $r $2 wall $(python3 -c "print(round($e-$s,1))") s"
          }
          for r in 1 2 3; do
            case $r in
              1) run 3.12 "3.12 default" ""; run 3.12 "3.12 at 2000" "2000,10,10"; run 3.13 "3.13 default" "" ;;
              2) run 3.13 "3.13 default" ""; run 3.12 "3.12 default" ""; run 3.12 "3.12 at 2000" "2000,10,10" ;;
              3) run 3.12 "3.12 at 2000" "2000,10,10"; run 3.13 "3.13 default" ""; run 3.12 "3.12 default" "" ;;
            esac
          done
