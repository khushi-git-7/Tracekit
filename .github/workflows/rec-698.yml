name: rec-698
on:
  push:
    branches: [verify/698-record]
permissions:
  contents: read
jobs:
  record:
    name: record Open Interpreter hook payloads
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OI_TAG: rust-v0.0.61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: install Open Interpreter ${{ env.OI_TAG }} (release binary)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o oi.tar.gz "https://github.com/openinterpreter/openinterpreter/releases/download/$OI_TAG/open-interpreter-package-x86_64-unknown-linux-musl.tar.gz"
          sha256sum oi.tar.gz
          tar -tzvf oi.tar.gz | head -40
          mkdir -p "$RUNNER_TEMP/oi-pkg" && tar -xzf oi.tar.gz -C "$RUNNER_TEMP/oi-pkg"
          BIN=$(dirname "$(find "$RUNNER_TEMP/oi-pkg" -type f \( -name interpreter -o -name codex \) | head -1)")
          echo "binary dir: $BIN"; ls -la "$BIN"
          [ -e "$BIN/interpreter" ] || ln -s "$BIN/codex" "$BIN/interpreter"
          echo "$BIN" >> "$GITHUB_PATH"
      - name: versions and help
        run: |
          interpreter --version
          interpreter --help | head -60
          interpreter exec --help | head -80
      - name: record
        env:
          OUT: ${{ runner.temp }}/rec698
        run: |
          chmod +x .github/rec698/run.sh
          interpreter features list || true
          # round 7 (#853 review): alias tools and filePath under claude-code, an Agent call, deepseek-tui's and
          # kimi-code's own tools, send_input's hook name, and whether swe-agent's and terminus-2's text actions fire
          for l in aliases deepseek kimi sendinput swe terminus; do
            mkdir -p "$RUNNER_TEMP/work-$l"
            python3 -c "import base64,sys; open(sys.argv[1],'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='))" "$RUNNER_TEMP/work-$l/pic.png"
          done
          MOCK_MODE=aliases .github/rec698/run.sh aliases 8711 messages claude-code claude-sonnet-4-5 bypass
          MOCK_MODE=deepseek .github/rec698/run.sh deepseek 8712 chat deepseek-tui deepseek-chat bypass
          MOCK_MODE=kimi .github/rec698/run.sh kimi 8713 chat kimi-code kimi-k2 bypass
          MOCK_MODE=sendinput .github/rec698/run.sh sendinput 8714 chat none gpt-5.1-codex bypass
          REC_TIMEOUT=120 MOCK_MODE=swe .github/rec698/run.sh swe 8715 chat swe-agent gpt-5.1-codex bypass
          REC_TIMEOUT=120 MOCK_MODE=terminus .github/rec698/run.sh terminus 8716 chat terminus-2 gpt-5.1-codex bypass
      - name: what exec's JavaScript reached without a tool
        env:
          OUT: ${{ runner.temp }}/rec698
        run: |
          python3 - <<'EOF'
          import json, os
          reqs = []
          print("GETs from inside exec that reached the mock:", [r["path"] for r in reqs if r["body"] == {"_get": True}])
          for r in reqs:
              s = json.dumps(r["body"])
              i = s.find("PROBE ")
              if i >= 0:
                  print(s[i:i + 2000])
                  break
          else:
              print("no PROBE output found in any request")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rec698
          path: ${{ runner.temp }}/rec698
