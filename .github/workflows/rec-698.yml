name: rec-698
on:
  push:
    branches: [verify/698-record]
permissions:
  contents: read
jobs:
  record:
    name: record Open Interpreter hook payloads
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OI_TAG: rust-v0.0.61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: install Open Interpreter ${{ env.OI_TAG }} (release binary)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o oi.tar.gz "https://github.com/openinterpreter/openinterpreter/releases/download/$OI_TAG/open-interpreter-package-x86_64-unknown-linux-musl.tar.gz"
          sha256sum oi.tar.gz
          tar -tzvf oi.tar.gz | head -40
          mkdir -p "$RUNNER_TEMP/oi-pkg" && tar -xzf oi.tar.gz -C "$RUNNER_TEMP/oi-pkg"
          BIN=$(dirname "$(find "$RUNNER_TEMP/oi-pkg" -type f \( -name interpreter -o -name codex \) | head -1)")
          echo "binary dir: $BIN"; ls -la "$BIN"
          [ -e "$BIN/interpreter" ] || ln -s "$BIN/codex" "$BIN/interpreter"
          echo "$BIN" >> "$GITHUB_PATH"
      - name: versions and help
        run: |
          interpreter --version
          interpreter --help | head -60
          interpreter exec --help | head -80
      - name: record
        env:
          OUT: ${{ runner.temp }}/rec698
        run: |
          chmod +x .github/rec698/run.sh
          interpreter features list || true
          # round 5 (#698 review): Code Mode only, with the exec reach probe; rounds 1-4 recorded the rest
          .github/rec698/run.sh code-mode 8707 responses none gpt-5.6-sol bypass
      - name: what exec's JavaScript reached without a tool
        env:
          OUT: ${{ runner.temp }}/rec698
        run: |
          python3 - <<'EOF'
          import json, os
          reqs = [json.loads(l) for l in open(os.path.join(os.environ["OUT"], "code-mode", "requests.jsonl"))]
          print("GETs from inside exec that reached the mock:", [r["path"] for r in reqs if r["body"] == {"_get": True}])
          for r in reqs:
              s = json.dumps(r["body"])
              i = s.find("PROBE ")
              if i >= 0:
                  print(s[i:i + 2000])
                  break
          else:
              print("no PROBE output found in any request")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rec698
          path: ${{ runner.temp }}/rec698
