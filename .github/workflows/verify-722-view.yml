name: verify-722-view
on:
  push:
    branches: [verify/722-view]
permissions:
  contents: read
env:
  T1: tests/test_view.py::View::test_a_growing_run_is_read_and_checked_from_where_it_was
  T2: tests/test_view.py::View::test_an_edit_of_records_read_before_is_caught_at_the_next_change_or_when_the_store_is_hashed_again
jobs:
  view:
    name: view ${{ matrix.os }} ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: main's two tests, three times (before)
        shell: bash
        run: |
          git log --oneline -3
          git show HEAD~2:tests/test_view.py > /tmp/main_view.py
          cp tests/test_view.py /tmp/fix_view.py
          cp /tmp/main_view.py tests/test_view.py
          for i in 1 2 3; do python -m pytest -q -p no:cacheprovider --durations=0 "$T1" "$T2" 2>&1 | grep -E "s call|passed|failed|skipped"; done
          cp /tmp/fix_view.py tests/test_view.py
      - name: this branch's two tests, three times (after)
        shell: bash
        run: for i in 1 2 3; do python -m pytest -q -p no:cacheprovider --durations=0 "$T1" "$T2" 2>&1 | grep -E "s call|passed|failed|skipped"; done
      - name: all of test_view.py with this branch
        shell: bash
        run: python -m pytest -q -p no:cacheprovider -o faulthandler_timeout=240 tests/test_view.py
      - name: pyflakes
        run: python -m pyflakes tests/test_view.py
