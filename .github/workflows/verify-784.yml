name: verify-784
on:
  push:
    branches: [verify/784-review]
permissions:
  contents: read
jobs:
  junction:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: The new tests, with the fix
        run: python -m pytest -v -rs -p no:cacheprovider tests/test_audit.py -k "junction or pre_v4_folders"
      - name: The same tests against the reader before the fix (expected to fail)
        shell: bash
        run: |
          git checkout 936c8a4 -- tracekit/audit.py
          python -m pytest -v -rs -p no:cacheprovider tests/test_audit.py -k "junction or pre_v4_folders" && exit 1 || echo "failed as expected"
