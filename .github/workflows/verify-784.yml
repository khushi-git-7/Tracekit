name: verify-784
on:
  push:
    branches: [verify/784-review]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyflakes tracekit tracekit_sdk.py tests eval examples
      - run: python -m pytest -q -o faulthandler_timeout=240 -p no:cacheprovider tests/test_audit.py tests/test_docs.py tests/test_readme.py tests/test_feedback.py tests/test_install_files.py tests/test_view.py
        env:
          PYTHONUTF8: "1"
