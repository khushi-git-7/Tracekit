name: rec-862
on:
  push:
    branches: [verify/862-record]
permissions:
  contents: read
jobs:
  record:
    name: record Claude Code Code Mode hook payloads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC_VERSION: 2.1.325
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install Claude Code ${{ env.CC_VERSION }}
        run: |
          node --version
          npm install -g "@anthropic-ai/claude-code@$CC_VERSION"
          claude --version
      - name: Code Mode's own text in the package
        run: |
          BIN=$(npm root -g)/@anthropic-ai/claude-code/node_modules/@anthropic-ai/claude-code-linux-x64/claude
          mkdir -p "$RUNNER_TEMP/rec862"
          python3 .github/rec862/src.py "$BIN" 3500 tengu_repl_mode_opt_in own_settings refusalForeseen \
            doToolOptionsLeaveReplOut "Code Mode (experimental)" engineCheckResult > "$RUNNER_TEMP/rec862/src-optin.txt"
          python3 .github/rec862/src.py "$BIN" 6000 "refused when a PreToolUse hook" hook_stopped_continuation \
            > "$RUNNER_TEMP/rec862/src-hooks.txt"
          wc -c "$RUNNER_TEMP"/rec862/src-*.txt
      - name: record
        env:
          OUT: ${{ runner.temp }}/rec862
        run: |
          chmod +x .github/rec862/run.sh
          # round 2: round 1's shell variable alone left Code Mode off in -p; try it from each settings file
          ON='{"env": {"CLAUDE_CODE_EXPERIMENTAL_CODE_MODE": "1"}}'
          MOCK_PLAN='[]' .github/rec862/run.sh base 8721 claude-sonnet-4-5 0
          MOCK_PLAN='[]' EXTRA_SETTINGS="$ON" .github/rec862/run.sh flag 8722 claude-sonnet-4-5 0
          MOCK_PLAN='[]' USER_SETTINGS="$ON" .github/rec862/run.sh user 8723 claude-sonnet-4-5 0
          MOCK_PLAN='[]' PROJECT_SETTINGS="$ON" .github/rec862/run.sh project 8724 claude-sonnet-4-5 0
          MOCK_PLAN='[]' USER_SETTINGS="$ON" .github/rec862/run.sh user-shell 8725 claude-sonnet-4-5 1
          MOCK_PLAN='[]' .github/rec862/run.sh shell-true 8726 claude-sonnet-4-5 true
          for l in base flag user project user-shell shell-true; do
            echo "== $l init tools:"; head -20 "$OUT/$l/out.jsonl" | python3 -c "import json,sys
          for l in sys.stdin:
              m = json.loads(l)
              if m.get('subtype') == 'init': print(m.get('tools'))
              if m.get('type') == 'system' and m.get('subtype') not in ('init', 'hook_started', 'hook_response'): print(l[:600])"
          done
      - name: the Code Mode tool as offered
        env:
          OUT: ${{ runner.temp }}/rec862
        run: |
          python3 - <<'EOF'
          import json, os
          for label in ("flag", "user", "project", "user-shell", "shell-true"):
              path = os.path.join(os.environ["OUT"], label, "requests.jsonl")
              if not os.path.exists(path):
                  print(label, "no requests"); continue
              base = set()
              for l in open(os.path.join(os.environ["OUT"], "base", "requests.jsonl")):
                  base |= {t.get("name") for t in json.loads(l).get("body", {}).get("tools") or []}
              seen = set()
              for l in open(path):
                  r = json.loads(l)
                  for t in r.get("body", {}).get("tools") or []:
                      if t.get("name") in seen or t.get("name") in base:
                          continue
                      seen.add(t.get("name"))
                      print("==", label, "new tool:", t.get("name"))
                      print(json.dumps(t, indent=1)[:12000])
              print("==", label, "tools no longer offered:", sorted(base - {t.get("name") for l in open(path)
                    for t in json.loads(l).get("body", {}).get("tools") or []}))
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rec862
          path: ${{ runner.temp }}/rec862
