name: live-698
on:
  push:
    branches: [verify/698-live]
permissions:
  contents: read
jobs:
  live:
    name: live Open Interpreter session with Tracekit's hooks (Gemini free tier)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OI_TAG: rust-v0.0.61
      MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: install Open Interpreter ${{ env.OI_TAG }} (release binary)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/oi-pkg"
          curl -fsSL -o oi.tar.gz "https://github.com/openinterpreter/openinterpreter/releases/download/$OI_TAG/open-interpreter-package-x86_64-unknown-linux-musl.tar.gz"
          sha256sum oi.tar.gz
          tar -xzf oi.tar.gz -C "$RUNNER_TEMP/oi-pkg"
          BIN=$(dirname "$(find "$RUNNER_TEMP/oi-pkg" -type f \( -name interpreter -o -name codex \) | head -1)")
          [ -e "$BIN/interpreter" ] || ln -s "$BIN/codex" "$BIN/interpreter"
          echo "$BIN" >> "$GITHUB_PATH"
      - name: live session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUT: ${{ runner.temp }}/live698
        run: |
          mkdir -p "$OUT"
          interpreter --version
          bash .github/live698/live.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live698
          path: ${{ runner.temp }}/live698
