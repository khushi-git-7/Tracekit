name: verify-722e
on:
  push:
    branches: [verify/722-e20]
permissions:
  contents: read
jobs:
  e20:
    name: e20 probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --no-tags --depth=1 https://github.com/Cygnux-Labs/Tracekit "+refs/tags/v*:refs/tags/v*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: ModelArm as on main
        run: python -m pytest -q --durations=3 -p no:cacheprovider tests/test_review_model.py::ModelArm
      - name: "Experiments: one opener reused / fsync stubbed / both"
        shell: bash
        run: |
          cat > exp.py <<'PY'
          import os, sys, pytest
          import tracekit.reviewer as rv, tracekit.storage.file as f
          if "opener" in sys.argv[1]:
              one = rv.no_redirect_opener()
              rv.no_redirect_opener = lambda context=None: one
          if "fsync" in sys.argv[1]:
              os.fsync = lambda fd: None
              if hasattr(os, "fdatasync"): os.fdatasync = lambda fd: None
              f._sync = lambda fd, full: None
          sys.exit(pytest.main(["-q", "--durations=1", "-p", "no:cacheprovider", "tests/test_review_model.py::ModelArm"]))
          PY
          for e in opener fsync opener+fsync; do echo "### $e"; python exp.py $e | grep -E "s call|passed|failed"; done
