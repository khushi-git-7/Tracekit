name: capture-cline
on:
  push:
    branches: [verify/695-capture]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [allow, cancel]
    env:
      CAPTURE_DIR: /tmp/capture
      CAPTURE_WORK: /tmp/clinework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g cline@3.0.74
      - name: A recording hook for every event, in ~/Documents/Cline/Hooks only
        run: |
          mkdir -p "$CAPTURE_DIR" "$CAPTURE_WORK" ~/Documents/Cline/Hooks
          echo "some notes" > "$CAPTURE_WORK/notes.txt"
          for e in PreToolUse PostToolUse TaskStart TaskComplete TaskCancel UserPromptSubmit; do
            cp capture/record_hook.sh ~/Documents/Cline/Hooks/$e
            chmod +x ~/Documents/Cline/Hooks/$e
          done
          if [ "${{ matrix.mode }}" = cancel ]; then touch "$CAPTURE_DIR/cancel-run_commands"; fi
          cd "$CAPTURE_WORK" && git init -q
      - name: Scripted model
        run: |
          nohup python3 capture/fake_model.py 8765 > "$CAPTURE_DIR/model.log" 2>&1 &
          sleep 1
      - name: Point the CLI at the scripted model
        run: cline auth --provider openai-compatible --apikey test --modelid scripted --baseurl http://127.0.0.1:8765/v1
      - name: One headless task
        working-directory: /tmp/clinework
        run: |
          timeout 180 cline --yolo --json "Run the command, read notes.txt, then create created.txt" \
            > "$CAPTURE_DIR/cline.ndjson" 2> "$CAPTURE_DIR/cline.err"; echo "exit $?"
      - name: What was captured
        if: always()
        run: |
          cut -f2 "$CAPTURE_DIR/hooks.tsv" | uniq -c || echo "no hook ran"
          for f in $(ls "$CAPTURE_DIR"/hook-*.json | grep -v UserPromptSubmit); do echo "== $f"; cat "$f"; echo; done
          echo "== stderr"; tail -c 3000 "$CAPTURE_DIR/cline.err" || true
          echo "== ndjson tail"; tail -c 5000 "$CAPTURE_DIR/cline.ndjson" || true
          echo "== model requests"; grep -c POST "$CAPTURE_DIR/requests.jsonl" || true
          ls -la /tmp/clinework
