name: verify-591
on:
  push:
    branches: [verify/591-box]
permissions:
  contents: read
env:
  FILES: tests/test_box.py tests/test_box_channel.py tests/test_findings_box.py tests/test_ts_verifier.py tests/test_tailer.py tests/test_bundle_v2.py tests/test_doctor_v2.py tests/test_identity.py tests/test_remote_tokens.py tests/test_verify_short.py tests/test_readme.py
jobs:
  live:
    name: box live in Docker (BoxInDocker, box_probe, relay-only network) ubuntu-latest 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Docker and cgroups on this runner
        run: |
          docker version --format '{{.Server.Version}}'
          docker info --format 'cgroup v{{.CgroupVersion}}, driver {{.CgroupDriver}}, rootless={{.SecurityOptions}}'
      - name: tests/test_box.py, every skip shown
        run: python -m pytest -v -rs -p no:cacheprovider -o faulthandler_timeout=900 tests/test_box.py
  files:
    name: changed areas ${{ matrix.os }} ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --no-tags --depth=1 https://github.com/Cygnux-Labs/Tracekit "+refs/tags/v*:refs/tags/v*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" pyflakes
      - name: the TypeScript verifier's packages (test_ts_verifier compiles it)
        shell: bash
        run: cd sdk/typescript && npm install --no-audit --no-fund
      - name: pyflakes (make lint)
        run: python -m pyflakes tracekit tracekit_sdk.py tests eval examples contrib integrations
      - name: tests
        shell: bash
        run: python -m pytest -q -rs -p no:cacheprovider -o faulthandler_timeout=600 $FILES
  ts:
    name: make test-ts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: make test-ts PY=python
  full:
    name: full suite ubuntu 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --no-tags --depth=1 https://github.com/Cygnux-Labs/Tracekit "+refs/tags/v*:refs/tags/v*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: cd sdk/typescript && npm install --no-audit --no-fund
      - run: python -m pytest -q -p no:cacheprovider -o faulthandler_timeout=600
